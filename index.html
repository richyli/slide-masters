<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide Master Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：左側是訊息意圖的家族（只展開目前一類）；中間是母版線框牆；右側是選中母版的規格書。三欄同時在第一屏。 */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #17202a; --muted: #5a6774; --line: #d3dae1;
  --accent: #1d6b67; --accent-ink: #ffffff; --hi: #d4861c; --soft: #dbeae8; --slide: #ffffff; --wtx: #b9c2cb;
  --f-N: #6b7a8c; --f-S: #1d6b67; --f-Q: #2f62b8; --f-X: #7b52b0; --f-C: #b07a12; --f-R: #2e8a4a; --f-P: #b5523a; --f-A: #8a8f96;
  --sans: "IBM Plex Sans", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Noto Sans TC", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #161d23; --ink: #e5ebef; --muted: #95a3af; --line: #2a353e;
  --accent: #4fb0a9; --accent-ink: #0b1215; --hi: #f0a54a; --soft: #1d3432; --slide: #1c252c; --wtx: #4a5763;
  --f-N: #9aa8b8; --f-S: #4fb0a9; --f-Q: #6f9be6; --f-X: #ad8ae0; --f-C: #e0b04a; --f-R: #63c283; --f-P: #e48a72; --f-A: #a3a9b0;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --ink: #e5ebef; --muted: #95a3af; --line: #2a353e;
  --accent: #4fb0a9; --accent-ink: #0b1215; --hi: #f0a54a; --soft: #1d3432; --slide: #1c252c; --wtx: #4a5763;
  --f-N: #9aa8b8; --f-S: #4fb0a9; --f-Q: #6f9be6; --f-X: #ad8ae0; --f-C: #e0b04a; --f-R: #63c283; --f-P: #e48a72; --f-A: #a3a9b0;
  color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); margin: 0; display: flex; flex-direction: column }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.cnt { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums }
.codename { font: 600 12px var(--mono); letter-spacing: .06em }

/* 頂列 */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; border-bottom: 1px solid var(--line); background: var(--panel) }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand h1 { font-size: 18px; margin: 0; letter-spacing: .02em; font-weight: 700; white-space: nowrap }
.brand .stat { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums }
.tools { display: flex; gap: 8px; align-items: center; flex: 1 1 520px; min-width: 0; justify-content: flex-end }
.search { position: relative; flex: 1 1 340px; max-width: 520px; min-width: 0 }
.search input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg) }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none }
select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink) }

/* 三欄 */
.main { display: grid; grid-template-columns: 236px minmax(0, 1fr) 400px; flex: 1; min-height: 0 }
.main > * { min-width: 0; overflow: auto }
.main.tt { grid-template-columns: 236px minmax(0, 1fr) }
.main.tt aside.detail { display: none }
.main.tt nav.tree [aria-current="true"] { background: none }
nav.tree { border-right: 1px solid var(--line); padding: 8px 8px 30px; background: var(--panel) }
section.grid { padding: 0 16px 40px }
aside.detail { border-left: 1px solid var(--line); background: var(--panel); padding: 14px 18px 40px }

/* 意圖家族（手風琴） */
.tree .all { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; cursor: pointer; font-weight: 600; border-radius: 5px }
.fam { margin-top: 2px }
.fam > button { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; cursor: pointer; border-radius: 5px; column-gap: 6px }
.fam > button .fc, .typetable .fc { font: 600 12px var(--mono); color: var(--panel); background: var(--fc); width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center }
.fam > button .fn { font-weight: 600 }
.fam > button small { grid-column: 2 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.35 }
.fam ul { list-style: none; margin: 2px 0 6px; padding: 0 0 0 26px }
.fam:not(.open) ul { display: none }
.fam li button { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; cursor: pointer; border-radius: 4px; font-size: 13px }
.fam li .code { font: 500 11.5px var(--mono); color: var(--muted) }
.tree button:hover { background: var(--bg) }
.tree button[aria-current="true"] { background: var(--soft) }
.l2chips { display: none }

/* 結果列 */
.resbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 0 8px; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 12px; font-size: 13px }
.resbar .what { flex: 1 1 auto; min-width: 0 }
.resbar .what b { font-variant-numeric: tabular-nums }
.resbar .hint { color: var(--hi); font-weight: 600 }
.linkbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; white-space: nowrap }
.linkbtn:hover { border-color: var(--muted) }

/* 型式說明條 */
.typebar { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--fc, var(--accent)); border-radius: 6px; padding: 9px 14px; margin-bottom: 12px }
.typebar h2 { margin: 0 0 2px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.typebar p { margin: 2px 0; color: var(--muted); max-width: 80ch }

/* 母版牆 */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 8px 8px 9px; cursor: pointer; text-align: left; display: grid; gap: 4px; transition: border-color .12s; align-content: start }
.card:hover { border-color: var(--muted) }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.card .meta { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; margin-top: 3px }
.card .id { font: 600 12px var(--mono); color: var(--fc) }
.card .nm { font: 600 12.5px var(--mono); letter-spacing: .03em; line-height: 1.35; overflow-wrap: anywhere }
.sub { font-weight: 400; color: var(--muted); font-size: .85em }
.card .sub { font-size: 11.5px; line-height: 1.35 }
.card .codename { font-size: 10.5px; color: var(--muted); letter-spacing: .04em }
.empty { color: var(--muted); padding: 8px 0 }
.lead { display: none; margin: 0 0 10px; color: var(--muted); font-size: 13px }
.grouphead { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line) }
.cards > .grouphead:first-child { margin-top: 0 }
.grouphead b { font-size: 14px }
.intentbtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin: 8px 0 }
.intentbtns button { display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; cursor: pointer }
.intentbtns button:hover { border-color: var(--fc) }
.intentbtns .fc { font: 600 12px var(--mono); color: var(--panel); background: var(--fc); width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; grid-row: span 2 }
.intentbtns small { color: var(--muted) }

/* 線框 */
svg.wire { display: block; width: 100%; height: auto; border-radius: 3px }
.w-pg { fill: var(--slide) } .w-frame { stroke: var(--line); stroke-width: .8 }
.w-ink { fill: var(--ink) } .w-tx { fill: var(--wtx) } .w-ac { fill: var(--accent) } .w-hi { fill: var(--hi) } .w-so { fill: var(--soft) }
.w-on { fill: var(--slide) } .w-ln { stroke: var(--muted); stroke-width: .6; fill: none } .w-ln.w-pg { fill: var(--slide) } .w-so.w-ln { fill: var(--soft) }
.w-thick { stroke: var(--accent); stroke-width: 1.4 } .w-dash { stroke-dasharray: 2 2 } .w-faint { opacity: .5 } .w-op { opacity: .75 }
.w-ring { fill: none; stroke: var(--hi); stroke-width: 1.2 } .w-stroke-ac { fill: none; stroke: var(--accent); stroke-width: 1.6 }
.w-stroke-tx { fill: none; stroke: var(--wtx); stroke-width: 1.4 } .w-stroke-hi { fill: none; stroke: var(--hi); stroke-width: 1.6 }
.w-stroke-ink { fill: none; stroke: var(--ink); stroke-width: 1 } .w-pie { stroke: var(--slide); stroke-width: .8 }

/* 規格書 */
.crumb { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center }
.crumb b { color: var(--ink); font-weight: 600 }
.detail h2 { font-size: 19px; margin: 4px 0 2px; line-height: 1.3; text-wrap: balance }
.detail .big { margin: 8px 0 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.detail h3 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 12px 0 3px; font-weight: 600 }
.detail p { margin: 0 0 6px }
.sibchips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; scrollbar-width: thin }
.sibchips span { font-size: 12px; color: var(--muted); align-self: center; white-space: nowrap }
.sibchips button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; white-space: nowrap }
.sibchips button b { font: 600 11px var(--mono); margin-right: 4px }
.sibchips button:hover { border-color: var(--muted) }
.pattern { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border-radius: 5px; padding: 7px 9px; margin-bottom: 6px }
.example { border-left: 3px solid var(--hi); padding: 2px 0 2px 10px; margin: 6px 0 }
.warn { background: color-mix(in srgb, var(--hi) 12%, transparent); border-radius: 6px; padding: 8px 10px }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted) }
.stats { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap }
.stats b { color: var(--ink); font-size: 15px }
.pop { font-size: 11.5px; color: var(--muted); white-space: nowrap }
.stats .pop { font-size: 12.5px }
.pop3 { color: var(--hi); font-weight: 600 }
.pop2 { color: var(--ink) }
.refs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px }
.refs button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 3px; cursor: zoom-in; text-align: left }
.refs img { display: block; height: 72px; width: auto; max-width: none; background: var(--bg) }
.refs span { display: block; font: 500 10.5px var(--mono); color: var(--muted); padding: 2px 2px 0 }
.localtag { font-size: 11px; color: var(--hi); font-weight: 600; letter-spacing: 0 }
.close { display: none }
.intro h2 { font-size: 18px }
.intro ol { padding-left: 20px; margin: 8px 0 }
.intro li { margin-bottom: 10px }

/* 型式總表 */
.typetable { display: grid; gap: 18px; padding-top: 12px }
.typetable section h2 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.typetable .fc { width: 20px; height: 20px }
.ttwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel) }
table.tt { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px }
.tt th, .tt td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
.tt th { white-space: nowrap; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; background: var(--bg) }
.tt tr:last-child td { border-bottom: 0 }
.tt td.c { font: 600 12px var(--mono); white-space: nowrap }
.tt td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.tt button { white-space: nowrap; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font: inherit }

/* 燈箱 */
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; z-index: 50; padding: 20px }
.lightbox img { max-width: min(96vw, 1000px); max-height: 86vh; background: #fff; border-radius: 4px }
.lightbox p { color: #fff; text-align: center; font: 500 13px var(--mono); margin: 8px 0 0 }

@media (max-width: 1180px) { .main { grid-template-columns: 210px minmax(0, 1fr) 340px } .main.tt { grid-template-columns: 210px minmax(0, 1fr) } .brand .stat { display: none } }
@media (max-width: 900px) {
  html, body { height: auto }
  body { display: block }
  .main, .main.tt { display: block; height: auto }
  .tools { flex-wrap: wrap; justify-content: stretch } .search { flex: 1 1 100%; max-width: none } #lay { flex: 1 1 0; min-width: 0 }
  nav.tree { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 0; overflow: visible }
  .tree .fams { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 2px }
  .tree .all { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); gap: 6px }
  .fam { margin: 0; flex: none }
  .fam ul, .fam > button small { display: none }
  .fam > button { white-space: nowrap; border: 1px solid var(--line); grid-template-columns: 22px auto auto }
  .l2chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 0 }
  .l2chips:empty { display: none }
  .l2chips button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; white-space: nowrap; cursor: pointer }
  .l2chips button[aria-current="true"] { background: var(--soft); border-color: var(--accent) }
  section.grid { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .resbar { position: static }
  .lead { display: block }
  aside.detail { position: fixed; inset: 0; z-index: 40; overflow: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-left: 0 }
  aside.detail:not(.open) { display: none }
  .close { display: block; position: sticky; top: 0; z-index: 2; margin: 0 -16px 8px; padding: 10px 16px; width: calc(100% + 32px); text-align: right; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; color: var(--accent) }
}
@media (max-width: 600px) and (min-width: 340px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top wrap">
  <div class="brand"><h1>Slide Master Library <span class="sub">顧問簡報母版庫</span></h1><span class="stat" id="stat"></span></div>
  <div class="tools">
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
      <input id="q" type="search" placeholder="輸入想講的話或代碼，例：比同業高、BRIDGE、R1" aria-label="搜尋母版：輸入想講的話或代碼"></label>
    <select id="lay" aria-label="依版面骨架篩選"><option value="">版面骨架：全部</option></select>
    <div class="seg" role="group" aria-label="檢視"><button id="v-m" aria-pressed="true">母版牆</button><button id="v-t" aria-pressed="false">型式總表</button></div>
  </div>
</header>

<div class="main" id="main">
  <nav class="tree" id="tree" aria-label="訊息意圖與型式"></nav>
  <section class="grid" id="grid"></section>
  <aside class="detail" id="detail" aria-live="polite"></aside>
</div>
<div class="lightbox" id="lb" hidden></div>

    for (const m of list) {
      if (m.l2 !== cur && !state.l2) { cur = m.l2; const t = L2[cur]; h += `<div class="grouphead"><b>${t.code} ${esc(t.en)}</b><span class="sub">${esc(t.zh)}</span><span class="codename" style="color:var(--f-${t.l1})">${t.codename}</span><span class="cnt">${esc(t.q)}</span></div>` }
      h += card(m);
    }
  }
  $('#grid').innerHTML = h + '</div>';
  if (state.sel && !list.some(m => m.id === state.sel) && !narrow()) select(list[0].id, false);
}
function renderTypes() {
  let h = '<div class="typetable">';
  for (const f of DB.l1) {
    h += `<section style="--fc:var(--f-${f.code})"><h2><span class="fc">${f.code}</span>${esc(f.en)} <span class="cnt">${esc(f.zh)}｜${esc(f.q)}</span></h2><div class="ttwrap"><table class="tt"><thead><tr><th>代碼</th><th>英文代號</th><th>型式</th><th>回答的問題</th><th>標題句型</th><th>熱門度</th><th>母版</th></tr></thead><tbody>`;
    for (const t of DB.l2.filter(t => t.l1 === f.code)) {
      const ms = DB.masters.filter(m => m.l2 === t.code);
      h += `<tr><td class="c"><button data-goto="${t.code}">${t.code}</button></td><td class="c">${t.codename}</td><td>${esc(t.en)}<br><span class="cnt">${esc(t.zh)}</span></td><td>${esc(t.q)}</td><td>${esc(t.pattern)}</td><td class="n">${popTag(t.pop)}</td><td><button data-goto="${t.code}">${ms.length} 個</button></td></tr>`;
    }
    h += '</tbody></table></div></section>';
  }
  $('#grid').innerHTML = h + '</div>';
}
function toGridTop() {
  if (!narrow()) { $('#grid').scrollTop = 0; return }
  const y = $('#grid').getBoundingClientRect().top + scrollY - $('#tree').offsetHeight;
  if (scrollY > y) scrollTo(0, y);
}
function refresh() { renderTree(); renderGrid(); toGridTop() }

$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) return select(c.dataset.id, true);
  const g = e.target.closest('[data-goto]'); if (g) { Object.assign(state, { fam: L2[g.dataset.goto].l1, l2: g.dataset.goto }); setView('m'); return refresh() }
  const i = e.target.closest('[data-intent]'); if (i) { Object.assign(state, { fam: i.dataset.intent, l2: '', q: '', lay: '' }); $('#q').value = ''; $('#lay').value = ''; return refresh() }
  if (e.target.closest('[data-clear]')) { Object.assign(state, { fam: '', l2: '', q: '', lay: '' }); $('#q').value = ''; $('#lay').value = ''; refresh() }
});
$('#grid').addEventListener('change', e => { if (e.target.id === 'sort') { state.sort = e.target.value; renderGrid() } });

/* ── 右欄：規格書（手機為覆蓋層） ── */
function intro() {
  $('#detail').innerHTML = `<div class="intro"><h2>從一句話找到投影片版面</h2>
    <p>分類的依據是「這頁要讓聽眾記住什麼」，不是頁面上有什麼圖。</p>
    <p class="cnt">熱門度看的是參考的顧問報告裡有多少比例用過這個母版：一半以上為高，25% 到 49% 為中，不到 25% 為低。</p>
    <ol><li><b>手上有一句想講的話</b>：打在上方搜尋框，例如「我們的成本比同業高」，會推測適合的訊息型式。</li>
    <li><b>知道代碼</b>：直接打 BRIDGE、R1、Q2-A。</li>
    <li><b>依意圖瀏覽</b>：${intentButtons()}</li>
    <li><b>一次看 ${DB.l2.length} 種型式</b>：<button class="linkbtn" data-totypes>打開型式總表</button></li></ol>
    <p class="cnt">點任何一張母版，這裡會換成它的規格：線框、何時用、什麼情況下會錯、標題句型。</p></div>`;
}
function select(id, open) {
  const m = M[id]; if (!m) return;
  state.sel = id;
  document.querySelectorAll('.card').forEach(c => c.setAttribute('aria-current', c.dataset.id === id));
  const t = L2[m.l2], f = L1[t.l1];
  const sibs = DB.masters.filter(x => x.l2 === m.l2 && x.id !== id);
  let h = `<button class="close" id="close">關閉 ✕</button>
    <div class="crumb"><span>${f.code} ${esc(f.en)}</span>›<span>${t.code} ${t.codename} ${esc(t.en)}</span>›<b>${m.id}</b></div>
    <h2>${esc(m.name)}</h2><div class="sub">${esc(m.zh)}</div>`;
  if (sibs.length) h += `<div class="sibchips"><span>同型式：</span>${sibs.map(s => `<button data-sib="${s.id}"><b>${s.id}</b>${esc(s.name)}</button>`).join('')}</div>`;
  h += `<div class="big">${m.svg}</div>`;
  if (LOCAL && m.refs && m.refs.length) h += `<h3>參考頁 <span class="localtag">本機版才有</span></h3><div class="refs">${m.refs.map(r => `<button data-img="${r.img}" data-cap="${esc(r.cap)}"><img loading="lazy" src="${r.img}" alt="${esc(r.cap)}"><span>${esc(r.deck)} p${r.page}</span></button>`).join('')}</div>`;
  h += `<div class="stats">${popTag(m.pop)}<span>版面骨架：${esc(DB.layouts[m.lay] || m.lay)}</span>${m.chart ? `<span>常用圖表：${esc(m.chart)}</span>` : ''}</div>
    <h3>什麼時候用</h3><p>${esc(m.use)}</p>
    <h3>什麼情況下會錯</h3><p class="warn">${esc(m.wrong)}</p>
    <h3>標題句型</h3><div class="pattern">${esc(m.pattern || t.pattern)}</div>
    ${m.example ? `<div class="example">${esc(m.example)}</div>` : ''}
    <h3>版面結構</h3><p>${esc(m.structure)}</p>
    <div class="chips">${(m.elements || []).map(e => `<span class="chip">${esc(e)}</span>`).join('')}</div>`;
  if (state.l2 !== m.l2) h += `<h3>這個型式回答</h3><p>${esc(t.q)}</p>`;
  $('#detail').innerHTML = h;
  $('#detail').scrollTop = 0;
  if (open && narrow()) {
    if (!$('#detail').classList.contains('open')) { try { history.pushState({ d: id }, '', '#' + id) } catch (e) {} }
    else { try { history.replaceState({ d: id }, '', '#' + id) } catch (e) {} }
    $('#detail').classList.add('open');
  } else { try { history.replaceState(null, '', '#' + id) } catch (e) {} }
}
function closeDetail() {
  if (!$('#detail').classList.contains('open')) return;
  $('#detail').classList.remove('open');
  if (history.state && history.state.d) { try { history.back() } catch (e) {} }
}
$('#detail').addEventListener('click', e => {
  if (e.target.closest('#close')) return closeDetail();
  const s = e.target.closest('[data-sib]'); if (s) { select(s.dataset.sib, true); const c = document.querySelector(`.card[data-id="${s.dataset.sib}"]`); if (c && !narrow()) c.scrollIntoView({ block: 'nearest' }); return }
  const i = e.target.closest('[data-intent]'); if (i) { Object.assign(state, { fam: i.dataset.intent, l2: '' }); return refresh() }
  if (e.target.closest('[data-totypes]')) return setView('t');
  const r = e.target.closest('[data-img]');
  if (r) { $('#lb').innerHTML = `<div><img src="${r.dataset.img}" alt=""><p>${r.dataset.cap}</p></div>`; $('#lb').hidden = false }
});
$('#lb').addEventListener('click', () => { $('#lb').hidden = true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#lb').hidden) $('#lb').hidden = true; else closeDetail() } });
addEventListener('popstate', () => { $('#detail').classList.remove('open') });
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (M[h] && h !== state.sel) select(h, narrow()) });

/* ── 檢視切換與輸入 ── */
function setView(v) {
  state.view = v;
  $('#v-m').setAttribute('aria-pressed', v === 'm'); $('#v-t').setAttribute('aria-pressed', v === 't');
  $('#main').classList.toggle('tt', v === 't');
  if (v === 't') { renderGrid(); toGridTop() }
}
$('#v-m').onclick = () => { setView('m'); refresh() };
$('#v-t').onclick = () => setView('t');
let qTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value.trim(); Object.assign(state, { fam: '', l2: '' }); setView('m'); refresh() }, 120);
});
$('#lay').addEventListener('change', e => { state.lay = e.target.value; setView('m'); refresh() });

renderTree(); renderGrid();
const first = (location.hash || '').slice(1);
if (M[first]) { select(first, narrow()); const c = document.querySelector(`.card[data-id="${first}"]`); if (c && !narrow()) c.scrollIntoView({ block: 'center' }) } else intro();
</script>

</html>
